name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /menudinamico/
      # La llave publicable de Supabase no es secreta (va en el navegador); la seguridad la da RLS.
      VITE_SUPABASE_URL: https://tgioyejecmcbxrwcjuub.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_bq8ZvvJu5Xxl_uXXYA__1A_Q_wt__hK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # GitHub Pages no tiene reescritura SPA: 404.html = index.html para rutas como /admin al recargar
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
